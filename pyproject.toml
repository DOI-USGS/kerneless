[build-system]
requires = ["setuptools>=45", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utcet"
version = "1.0.0"
description = "UTC to Ephemeris Time conversion utilities"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Kelvin Rodriguez"}
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "spiceypy>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
