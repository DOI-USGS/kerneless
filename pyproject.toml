[build-system]
requires = ["setuptools>=45", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kerneless"
version = "0.1.0"
description = "SPICE-compatible time conversion and DSK reading with no SPICE kernels or toolkit"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "CC0-1.0"}
authors = [
    {name = "Kelvin Rodriguez"}
]
dependencies = []

[tool.setuptools]
# The only importable artifact is the compiled extension module built in
# setup.py. Declaring this explicitly stops setuptools' flat-layout
# auto-discovery from picking up include/ and tests/ as packages, which would
# copy the headers into site-packages as well as the include prefix.
packages = []
py-modules = []

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "spiceypy>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
